<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AUREU — Twój dostęp</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#04050a;--card:#11151f;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
--txt:#E9ECF3;--mut:#98A2B3;--mut2:#5f6b7d;--gold:#F5C451;--gold-d:#E0A32E;--bad:#F87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
font:400 15px/1.6 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:40px 18px 60px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:30px}
.mark{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
background:radial-gradient(120% 120% at 30% 25%,#1b2438,#0b1120);
border:1px solid rgba(217,180,90,.5);color:var(--gold);font:800 19px/1 Inter,sans-serif}
.brand b{font:800 15px/1 Inter,sans-serif;letter-spacing:.16em}
h1{font:800 26px/1.2 Inter,sans-serif;margin:0 0 10px}
p{color:var(--mut);margin:0 0 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:20px 0}
.tokbox{font:600 13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--gold);
word-break:break-all;background:rgba(245,196,81,.08);border:1px solid rgba(245,196,81,.28);
border-radius:11px;padding:13px}
.btn{display:block;width:100%;margin-top:14px;padding:16px;border:0;border-radius:13px;cursor:pointer;
background:linear-gradient(180deg,var(--gold),var(--gold-d));color:#1a1408;
font:800 15px/1 Inter,sans-serif;text-align:center;text-decoration:none}
.btn.sec{background:rgba(255,255,255,.06);color:var(--txt);border:1px solid var(--line2)}
.err{color:var(--bad)}
.small{font-size:12.5px;color:var(--mut2);line-height:1.6}
.spin{width:26px;height:26px;border:3px solid rgba(255,255,255,.14);border-top-color:var(--gold);
border-radius:50%;animation:s .8s linear infinite;margin:6px 0 14px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="mark">A</div><b>AUREU</b></div>
  <div id="t"><div class="spin"></div><h1>Sprawdzam płatność…</h1>
  <p>Potwierdzam transakcję bezpośrednio w Stripe i nadaję dostęp do pokoju.</p></div>
  <div class="small" style="margin-top:34px">
    Kod dostępu zapisujemy w tej przeglądarce. Jeśli zmienisz urządzenie, wróć na ten adres
    z linku po płatności albo zachowaj kod z tej strony.
  </div>
</div>
<script>
(function(){
  var FN='https://mdsvcobwuezriexyqqby.supabase.co/functions/v1/aureu-dostep';
  var el=document.getElementById('t');
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function q(n){return new URLSearchParams(location.search).get(n);}
  var sid=q('s')||q('session_id');

  function blad(tytul,opis,pokazKontakt){
    el.innerHTML='<h1 class="err">'+esc(tytul)+'</h1><p>'+esc(opis)+'</p>'
      +(pokazKontakt?'<div class="box"><div class="small">Jeśli płatność przeszła, a to widzisz — '
      +'napisz na kg.regenevia@gmail.com i podaj adres e-mail użyty przy płatności. '
      +'Dostęp nadamy ręcznie.</div></div>':'')
      +'<a class="btn sec" href="/panel.html">Wróć do panelu</a>';
  }

  if(!sid){ blad('Brak identyfikatora płatności',
    'Ten adres otwiera się automatycznie po opłaceniu pokoju. Jeśli masz już kod dostępu, wejdź do panelu.',false); return; }

  fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({s:sid})})
  .then(function(r){return r.json();})
  .then(function(d){
    if(!d||!d.ok){
      var m={zly_identyfikator:'Ten link jest nieprawidłowy.',
             nie_znaleziono_platnosci:'Nie znaleźliśmy takiej płatności.',
             platnosc_nieoplacona:'Płatność nie została jeszcze zaksięgowana. Odśwież stronę za chwilę.',
             brak_wskazania_pokoju:'Płatność jest, ale nie wiemy, którego pokoju dotyczy.',
             brak_emaila_w_platnosci:'Płatność jest, ale bez adresu e-mail.'};
      blad('Nie mogę nadać dostępu', m[d&&d.blad]||('Powód: '+esc(d&&d.blad)), !!(d&&(d.kontakt||d.blad==='platnosc_nieoplacona')));
      return;
    }
    try{ localStorage.setItem('aureu_tok',d.token);
         localStorage.setItem('aureu_pokoj',d.pokoj); }catch(e){}
    var doKiedy='';
    try{ doKiedy=new Date(d.wazny_do).toLocaleDateString('pl-PL',{day:'numeric',month:'long',year:'numeric'}); }catch(e){}
    el.innerHTML='<h1>Dostęp nadany ✓</h1>'
      +'<p>Pokój <b>'+esc(d.pokoj)+'</b> jest otwarty'+(doKiedy?' do <b>'+esc(doKiedy)+'</b>':'')+'.</p>'
      +'<div class="box"><div class="small" style="margin-bottom:9px">TWÓJ KOD DOSTĘPU — zachowaj go, '
      +'jeśli chcesz wejść z innego urządzenia:</div><div class="tokbox">'+esc(d.token)+'</div></div>'
      +'<a class="btn" href="/panel.html?t='+encodeURIComponent(d.token)+'">Wejdź do pokoju</a>'
      +'<a class="btn sec" href="/pokoj.html?p='+encodeURIComponent(d.pokoj)+'">Zobacz opis pokoju</a>';
  })
  .catch(function(){ blad('Chwilowy błąd połączenia','Odśwież stronę za chwilę — płatność nie przepadła.',true); });
})();
</script>
</body>
</html>
