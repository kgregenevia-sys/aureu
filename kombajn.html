<!DOCTYPE html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kombajn — Kosiarka Okazji</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#07070c;--panel:#0f0f1a;--ink:#eef0ff;--mut:rgba(238,240,255,.55);--line:rgba(255,255,255,.09);--gold:#e0c992;--g:#3fbf7f;--y:#f5c451;--r:#f27272;--v:#8b8cf8}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 40% at 50% 0,rgba(139,140,248,.14),transparent 60%),#07070c}
.wrap{max-width:1000px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:23px;font-weight:800;letter-spacing:.3px}
h1 span{color:var(--gold)}
.sub{color:var(--mut);font-size:13px;margin-bottom:16px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 14px;text-align:center;flex:1;min-width:78px}
.stat b{display:block;font-size:20px}.stat small{color:var(--mut);font-size:11px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filters select,.filters button{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 12px;font-size:13px;cursor:pointer}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;position:relative}
.card.s9,.card.s8,.card.s7{border-color:rgba(63,191,127,.4)}
.score{position:absolute;top:14px;right:14px;font-weight:800;font-size:15px;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.sc-hi{background:rgba(63,191,127,.16);color:var(--g)}.sc-mid{background:rgba(245,196,81,.15);color:var(--y)}.sc-lo{background:rgba(242,114,114,.13);color:var(--r)}
.cat{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--v);font-weight:700}
.ttl{font-weight:700;font-size:15px;margin:3px 0;padding-right:46px}
.price{font-size:19px;font-weight:800;color:var(--gold)}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}
.chip{font-size:11px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:20px;padding:3px 10px;color:var(--mut)}
.chip.priv{color:var(--g);border-color:rgba(63,191,127,.3)}
.chip.firm{color:var(--r)}
.chip.sig{color:var(--y);border-color:rgba(245,196,81,.3)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:none;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn.open{background:var(--v);color:#0a0a14}
.btn.copy{background:var(--gold);color:#1a1405}
.btn.gh{background:transparent;border:1px solid var(--line);color:var(--mut)}
.status-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.status-row small{color:var(--mut);font-size:11px}
.st{font-size:11px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--mut);cursor:pointer}
.st.on{background:var(--g);color:#052012;border-color:transparent;font-weight:700}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--gold);color:#1a1405;padding:11px 22px;border-radius:30px;font-weight:700;font-size:13px;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--mut);padding:40px}
</style></head><body>
<div class="wrap">
  <h1>🌾 Kombajn <span>— Kosiarka Okazji</span></h1>
  <div class="sub">Auto-namierzone okazje luksusowe · sortowane po score (płynność × motywacja × marża)</div>
  <div class="stats" id="stats"></div>
  <div class="filters">
    <select id="fCat"><option value="">Wszystkie kategorie</option><option value="auto">Auta</option><option value="zegarek">Zegarki</option><option value="torebka">Torebki</option></select>
    <select id="fScore"><option value="0">Dowolny score</option><option value="7">Tylko 7+</option><option value="8">Tylko 8+</option><option value="9">Tylko 9</option></select>
    <select id="fSeller"><option value="">Wszyscy</option><option value="prywatny">Tylko prywatni</option></select>
    <select id="fStatus"><option value="">Wszystkie statusy</option><option value="nowa">Nowe</option><option value="do_zaczepienia">Do zaczepienia</option><option value="zaczepiony">Zaczepione</option><option value="w_komisie">W komisie</option><option value="sprzedane">Sprzedane</option></select>
    <button id="reload">↻ Odśwież</button>
  </div>
  <div id="list"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const SB="https://mdsvcobwuezriexyqqby.supabase.co";
const ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1kc3Zjb2J3dWV6cmlleHlxcWJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNjMxMjMsImV4cCI6MjA5MzYzOTEyM30.o4CVcSf9drtDxlpVv11T_E3N4dd-BSTrQPRCZXfpusg";
const H={"apikey":ANON,"Authorization":"Bearer "+ANON};
const STATUSES=[["nowa","Nowa"],["do_zaczepienia","Do zaczepienia"],["zaczepiony","Zaczepiony"],["w_komisie","W komisie"],["sprzedane","Sprzedane"],["odrzucone","Odrzuć"]];
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800);}
function money(n){return n?Number(n).toLocaleString('pl-PL')+' zł':'—';}
function scClass(s){return s>=7?'sc-hi':s>=5?'sc-mid':'sc-lo';}
async function loadStats(){
  try{const r=await fetch(SB+"/rest/v1/rpc/lux_stats",{method:"POST",headers:{...H,"Content-Type":"application/json"},body:"{}"});const s=await r.json();
  const pk=s.per_kat||{};
  document.getElementById('stats').innerHTML=
    `<div class="stat"><b>${s.total||0}</b><small>okazji</small></div>
     <div class="stat"><b style="color:var(--g)">${s.hot||0}</b><small>gorące 7+</small></div>
     <div class="stat"><b>${s.prywatni||0}</b><small>prywatni</small></div>
     <div class="stat"><b>${pk.auto||0}</b><small>auta</small></div>
     <div class="stat"><b>${pk.zegarek||0}</b><small>zegarki</small></div>
     <div class="stat"><b>${pk.torebka||0}</b><small>torebki</small></div>`;
  }catch(e){}
}
async function load(){
  const cat=fCat.value,sc=fScore.value,sel=fSeller.value,st=fStatus.value;
  let q=SB+"/rest/v1/lux_opportunities?select=*&order=total_score.desc,price.desc&limit=300";
  if(cat)q+="&category=eq."+cat;
  if(sc&&sc!=="0")q+="&total_score=gte."+sc;
  if(sel)q+="&seller_type=eq."+sel;
  if(st)q+="&status=eq."+st;
  const r=await fetch(q,{headers:H});const d=await r.json();
  const L=document.getElementById('list');
  if(!d.length){L.innerHTML='<div class="empty">Brak okazji dla tych filtrów.</div>';return;}
  L.innerHTML=d.map(o=>{
    const sig=(o.signals||'').trim().split(/\s+/).filter(Boolean).map(s=>`<span class="chip sig">⚡ ${s}</span>`).join('');
    const sellerChip=o.seller_type==='prywatny'?'<span class="chip priv">✓ prywatny</span>':(o.seller_type==='firma'?'<span class="chip firm">firma</span>':'<span class="chip">? sprzedawca</span>');
    const stBtns=STATUSES.map(([v,l])=>`<button class="st ${o.status===v?'on':''}" onclick="setStatus(${o.id},'${v}')">${l}</button>`).join('');
    return `<div class="card s${o.total_score}">
      <div class="score ${scClass(o.total_score)}">${o.total_score}</div>
      <div class="cat">${o.category} · ${o.brand||''}</div>
      <div class="ttl">${(o.title||'').replace(/</g,'')}</div>
      <div class="price">${money(o.price)}</div>
      <div class="meta">${sellerChip}${o.location?`<span class="chip">📍 ${o.location}</span>`:''}${sig}</div>
      <div class="acts">
        <a class="btn open" href="${o.ext_url}" target="_blank" rel="noopener">Otwórz ogłoszenie ↗</a>
        <button class="btn copy" onclick='copyMsg(${JSON.stringify(o.outreach_msg||"")})'>📋 Kopiuj zaczepkę</button>
      </div>
      <div class="status-row"><small>Status:</small>${stBtns}</div>
    </div>`;
  }).join('');
}
function copyMsg(m){navigator.clipboard&&navigator.clipboard.writeText(m);toast('Skopiowano zaczepkę ✓');}
async function setStatus(id,st){
  try{await fetch(SB+"/rest/v1/rpc/lux_set_status",{method:"POST",headers:{...H,"Content-Type":"application/json"},body:JSON.stringify({p_id:id,p_status:st})});
  toast('Status: '+st);load();loadStats();}catch(e){toast('Błąd');}
}
['fCat','fScore','fSeller','fStatus'].forEach(id=>document.getElementById(id).addEventListener('change',load));
document.getElementById('reload').addEventListener('click',()=>{load();loadStats();});
loadStats();load();
</script>
</body></html>
